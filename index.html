<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Il tuo PAC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: app a schermo intero da telefono (max 430px, centrata su desktop), una cosa per schermata.
   Quattro momenti approvati in Claude Design: costruisci il piano → rivelazione → carte evento → percorso e missioni.
   Token canonici Appress OS (tema scuro workspace), alone radiale come unico ornamento. */
:root{
  --bg:#0b0820;--panel:rgba(18,14,40,.55);--recess:rgba(11,8,32,.6);--card:#161033;
  --ink:#eceaf6;--ink2:#b3a9d6;--ink3:#8a80b0;--line:rgba(140,122,220,.16);--line2:rgba(140,122,220,.28);
  --viola:#7c5cff;--viola3:#a48bff;--ciano:#22c3d6;--ok:#4ee39a;--warn:#e6a23c;--bad:#ef5d7a;--gold:#f0c419;--white:#fff;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;overflow-x:hidden}
button,input{font:inherit;color:inherit}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--ciano);outline-offset:3px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:430px;min-height:100%;margin:0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column}
.glow{position:absolute;border-radius:50%;pointer-events:none;transition:transform 1.2s var(--ease)}
.screen{flex:1;display:flex;flex-direction:column;padding:18px max(22px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));position:relative;z-index:1;animation:in .38s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--recess);display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
.round[hidden]{display:block!important;visibility:hidden}
.xp{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--gold);border:1px solid rgba(240,196,25,.4);border-radius:999px;padding:6px 10px;white-space:nowrap}
.xp.pop{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.25);background:rgba(240,196,25,.15)}}
.dots{display:flex;gap:6px;align-items:center}
.dots i{height:6px;border-radius:3px;width:6px;background:rgba(140,122,220,.35);transition:all .3s var(--ease)}
.dots i.done{width:22px;background:var(--viola)}
.dots i.now{width:22px;background:var(--ink)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ciano)}
.q{margin-top:44px;display:flex;flex-direction:column;gap:12px}
.q h1{font-size:clamp(28px,8vw,34px);line-height:1.08}
.q p.sub{font-size:15px;color:var(--ink2)}
.bignum{margin-top:36px;text-align:center}
.bignum b{font-size:clamp(64px,20vw,84px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.bignum b small{font-size:.38em;color:var(--ink3);margin-left:6px;font-weight:600}
.bignum span{display:block;font-size:13px;color:var(--ink3);margin-top:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;margin-top:30px;background:linear-gradient(90deg,var(--viola) var(--p,30%),var(--recess) var(--p,30%));border:1px solid var(--line);outline-offset:10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--white);border:5px solid var(--viola);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--white);border:5px solid var(--viola);cursor:grab}
.minmax{display:flex;justify-content:space-between;margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--ink3)}
.chips{display:flex;gap:8px;margin-top:22px}
.chips.wrap{flex-wrap:wrap}
.chip{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-size:14px;cursor:pointer;padding:0 10px;transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{border-color:var(--viola);background:rgba(124,92,255,.18);color:var(--ink);font-weight:600}
.choices{display:grid;gap:10px;margin-top:30px}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;padding:16px 18px;border-radius:18px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:all .2s var(--ease)}
.choice b{font-size:18px;font-weight:600}
.choice span{font-size:14px;color:var(--ink2)}
.choice[aria-pressed="true"]{border-color:var(--viola);background:rgba(124,92,255,.16)}
.preview{margin-top:24px;display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:rgba(34,195,214,.08);border:1px solid rgba(34,195,214,.3);font-size:14px;line-height:1.35}
.preview em{font-style:normal;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ciano);white-space:nowrap}
.preview b{color:var(--ink)}
.cta{margin-top:auto;padding-top:24px;display:flex;flex-direction:column;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:16px;border:0;background:var(--viola);color:var(--white);font-size:17px;font-weight:600;cursor:pointer;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink2);min-height:44px;font-size:15px;font-weight:500}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1;font-size:15px;min-height:52px}

/* rivelazione */
.reveal{margin-top:36px;text-align:center;display:flex;flex-direction:column;gap:8px}
.reveal .lead{font-size:15px;color:var(--ink2)}
.reveal .big{font-size:clamp(60px,18vw,76px);font-weight:700;letter-spacing:-.04em;line-height:1}
.reveal .small{font-size:13px;color:var(--ink3)}
.bars{margin-top:32px;display:flex;align-items:flex-end;justify-content:center;gap:10px;height:230px}
.bar{display:flex;flex-direction:column;align-items:center;gap:8px;width:72px}
.bar b{font-size:14px;font-weight:600}
.bar i{display:block;width:72px;border-radius:14px 14px 6px 6px;height:0;transition:height .9s var(--ease)}
.bar span{font-size:12px;color:var(--ink2)}
.rank{margin-top:24px;display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
.medal{width:52px;height:52px;border-radius:14px;background:rgba(240,196,25,.12);border:1px solid rgba(240,196,25,.45);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:18px;color:var(--gold);flex:none}
.rank b{display:block;font-size:17px;font-weight:600}
.rank span{font-size:13px;color:var(--ink2)}

/* eventi */
.meter{margin-top:18px;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--recess);border:1px solid var(--line)}
.meter span{font-size:13px;color:var(--ink2)}
.meter b{font-size:22px}
.delta{font-size:13px;font-weight:600;margin-left:8px}
.deck{margin-top:26px;position:relative;height:min(470px,56vh);min-height:380px}
.ghostcard{position:absolute;border-radius:26px;border:1px solid var(--line)}
.ecard{position:absolute;inset:0;border-radius:26px;background:linear-gradient(180deg,#1c1640,#120e2a);border:1px solid rgba(164,139,255,.4);padding:26px 22px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.22);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transform:rotate(-2deg)}
.ecard.fly{transition:transform .35s var(--ease),opacity .35s}
.ecard .tag{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3)}
.ecard .tag b{font-family:var(--mono);letter-spacing:.12em;color:var(--viola3);font-weight:700}
.ecard h2{font-size:32px;line-height:1.05}
.ecard p{font-size:15px;color:var(--ink2)}
.ecard .imp{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:14px}
.ecard .imp div{display:flex;justify-content:space-between}
.ecard .imp span{color:var(--ink2)}
.stamp{position:absolute;top:22px;padding:4px 12px;border-radius:10px;border:2px solid;font-weight:700;font-size:15px;opacity:0;transition:opacity .15s}
.stamp.yes{right:20px;color:var(--ok);border-color:var(--ok);transform:rotate(10deg)}
.stamp.no{left:20px;color:var(--ink3);border-color:var(--ink3);transform:rotate(-10deg)}
.choicebtns{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:22px}
.cb{width:68px;height:68px;border-radius:34px;border:1px solid var(--line2);background:rgba(18,14,40,.8);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.cb.yes{background:var(--viola);border-color:var(--viola);color:var(--white)}
.cb.info{width:48px;height:48px;background:transparent;font-size:18px;font-weight:700}
.hint{text-align:center;font-size:12px;color:var(--ink3);margin-top:12px}
.explain{margin-top:8px;font-size:14px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}

/* missioni */
.xpbar{height:6px;border-radius:3px;background:var(--recess);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);transition:width .6s var(--ease)}
.path{margin-top:14px;position:relative;display:flex;flex-direction:column}
.path::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:rgba(140,122,220,.2)}
.lvl{display:flex;gap:14px;align-items:center;padding:8px 0;position:relative}
.lvl .n{width:44px;height:44px;border-radius:22px;background:var(--bg);border:1px solid rgba(140,122,220,.3);color:var(--ink3);display:grid;place-items:center;font-family:var(--mono);flex:none}
.lvl.done .n{background:var(--ok);border-color:var(--ok);color:var(--bg);font-weight:700}
.lvl.now{margin-left:-6px;padding:10px 12px 10px 6px;border-radius:16px;background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.5)}
.lvl.now .n{background:var(--viola);border-color:var(--viola);color:var(--white);font-weight:700;box-shadow:0 0 0 5px rgba(124,92,255,.22)}
.lvl .t{flex:1;min-width:0}
.lvl .t b{display:block;font-weight:600}
.lvl .t small{font-size:13px;color:var(--ink3)}
.lvl.now .t small{color:var(--ink2)}
.lvl .r{font-size:14px;color:var(--ink3);white-space:nowrap}
.lvl.now .r{font-size:16px;font-weight:700;color:var(--ink)}
.mis{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(140,122,220,.12);cursor:pointer}
.mis input{width:22px;height:22px;accent-color:var(--ok);margin:0;flex:none}
.mis span{flex:1;font-size:15px}
.mis:has(input:checked) span{color:var(--ink3);text-decoration:line-through}
.mis em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold)}
.scroll{overflow-y:auto}

.sr{position:absolute;left:-9999px}
.progress{flex:1;height:4px;border-radius:2px;background:rgba(140,122,220,.2);overflow:hidden;margin:0 6px}
.progress i{display:block;height:100%;background:var(--viola);transition:width .4s var(--ease)}
.lesson .q h1{font-size:clamp(28px,8vw,36px)}
.pts{margin:26px 0 0;padding:0;list-style:none;counter-reset:p;display:grid;gap:16px}
.pts li{counter-increment:p;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;font-size:16px;line-height:1.45}
.pts li::before{content:counter(p);width:30px;height:30px;border-radius:15px;background:rgba(34,195,214,.12);border:1px solid rgba(34,195,214,.4);color:var(--ciano);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.quiz{margin-top:28px;padding:18px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.qq{font-weight:600;font-size:16px}
.qopts{display:grid;gap:8px;margin-top:12px}
.qo{min-height:46px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--recess);cursor:pointer;font-size:15px}
.qo.right{border-color:var(--ok);background:rgba(78,227,154,.12)}
.qo.wrong{border-color:var(--bad);background:rgba(239,93,122,.1)}
.qo[disabled]{cursor:default}
.why{margin-top:12px;font-size:14px;color:var(--ink2)}
.why b{color:var(--ink)}
.etfs{display:grid;gap:10px;margin-top:10px}
.etf{padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.etfh{display:flex;gap:10px;align-items:baseline}
.etfh b{font-size:22px;color:var(--viola3);font-variant-numeric:tabular-nums}
.etfh span{font-weight:600;line-height:1.25}
.etf small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:4px}
.etfm{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--ink2)}
.note2{margin-top:12px;font-size:13px;color:var(--ink3);line-height:1.45}
.note2 b{color:var(--ink)}
.lessons{display:grid;gap:6px;margin-top:8px}
.lesbtn{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;font-size:15px}
.lesbtn em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--gold)}
.multi-hint{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.multi-hint+.choices{margin-top:10px}
.choice.multi{position:relative;padding-right:52px}
.choice.multi::after{content:"";position:absolute;right:18px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:6px;border:1.5px solid var(--ink3)}
.choice.multi[aria-pressed="true"]::after{background:var(--viola);border-color:var(--viola);box-shadow:inset 0 0 0 4px #1c1640}
.tips{display:grid;gap:8px;margin-top:10px}
.tip{display:grid;gap:2px;padding:12px 14px 12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative}
.tip::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--ciano)}
.tip.w::before{background:var(--warn)}.tip.ok::before{background:var(--ok)}
.tip b{font-size:15px;font-weight:600}
.tip span{font-size:14px;color:var(--ink2);line-height:1.45}
.homehero{margin-top:48px;display:flex;flex-direction:column;gap:14px}
.homehero h1{font-size:clamp(48px,14vw,64px);line-height:1}
.homehero h1 span{background:linear-gradient(90deg,var(--viola3),var(--ciano));-webkit-background-clip:text;background-clip:text;color:transparent}
.homehero p{font-size:17px;color:var(--ink2);max-width:32ch}
.paths{display:grid;gap:12px;margin-top:36px}
.pathcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:20px;border-radius:22px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;transition:transform .15s var(--ease)}
.pathcard:active{transform:scale(.98)}
.pathcard em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ciano)}
.pathcard b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pathcard span{font-size:14px;color:var(--ink2)}
.pathcard.main{background:var(--viola);border-color:var(--viola)}
.pathcard.main em{color:rgba(255,255,255,.8)}.pathcard.main span{color:rgba(255,255,255,.85)}
.lesbtn.big{min-height:60px;padding:10px 14px}
.lesbtn.big small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.08em}
.app{overflow:clip}
body{overflow-x:clip}
.screen{align-items:stretch}
.top{width:100%}
.rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.choice.tap{animation:tap .32s var(--ease)}
@keyframes tap{40%{transform:scale(.97)}}
.fxp{position:fixed;z-index:50;transform:translateX(-50%);font-family:var(--mono);font-size:13px;font-weight:700;color:var(--gold);pointer-events:none;animation:fxp 1.1s var(--ease) forwards}
@keyframes fxp{from{opacity:0;transform:translate(-50%,6px)}25%{opacity:1}to{opacity:0;transform:translate(-50%,-26px)}}
.ecard{animation:deal .5s var(--ease) both}
@keyframes deal{from{opacity:0;transform:translateY(60px) rotate(-9deg)}}
.reveal .big{animation:glow 2.4s ease-in-out 1.4s infinite alternate}
@keyframes glow{to{text-shadow:0 0 28px rgba(124,92,255,.55)}}
.medal{animation:medal .7s cubic-bezier(.2,1.6,.4,1) .3s both}
@keyframes medal{from{transform:scale(.4) rotate(-20deg);opacity:0}}
.homehero h1 span{background-size:200% 100%;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.homehero h1 span{background-image:linear-gradient(90deg,var(--viola3),var(--ciano),var(--viola3))}
.lvl.now .n{animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}100%{box-shadow:0 0 0 14px rgba(124,92,255,0)}}
.path::before{transform-origin:top;animation:draw 1s var(--ease) both}
@keyframes draw{from{transform:scaleY(0)}}
.bignum b{display:inline-block;transition:transform .15s var(--ease)}
.deck{margin-left:4px;margin-right:4px}
.choicebtns,.hint{width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>

</div>

function advice(P,R){
  var out=[],H=holdings(P),rows=R.rows,yrs=rows.length,first=rows[0],full=rows.filter(function(x){return x.liq>=P.mesiEmerg*x.spese-1})[0];
  if(!full||full.y>Y0)out.push(["w","Prima il fondo emergenza","Ti mancano "+eur(Math.max(0,P.mesiEmerg*first.spese-P.risparmi))+" per avere "+P.mesiEmerg+" mesi di spese da parte. Finché non ci sei, tieni la rata bassa."]);
  else if(P.risparmi>P.mesiEmerg*first.spese*2)out.push(["i","Hai più liquidità del necessario","Oltre il fondo emergenza hai circa "+eur(P.risparmi-P.mesiEmerg*first.spese)+". Puoi investirne una parte un po' al mese, nei prossimi 12 mesi, invece che tutta subito."]);
  if(P.rata0<100&&H.length>1)out.push(["w","Con meno di 100 € basta un ETF","Con rate piccole le quote intere di due ETF si comprano lentamente. Parti con la sola parte principale e aggiungi il resto quando la rata sale."]);
  H.forEach(function(h){var e=ETF[h[0]],m=P.rata0*h[1];if(m>0&&m<e.px)out.push(["i","Una quota ogni "+Math.ceil(e.px/m)+" mesi",e.n+" costa circa "+e.px.toLocaleString("it-IT")+" € a quota e tu ci metti "+eur(m)+" al mese: la cifra si accumula finché non basta."])});
  if(P.rata0>=500&&H.length<3)out.push(["ok","Con "+eur(P.rata0)+" al mese puoi diversificare di più","Puoi permetterti 3 ETF: la parte principale, un'area in crescita e una quota di titoli di Stato che attutisce i crolli. Oltre 3 ETF il beneficio è minimo e la gestione si complica."]);
  if(P.core==="sp"&&!P.sats.some(function(k){return k==="easia"}))out.push(["i","Tutto su un solo paese","L'S&P 500 è solo USA e in dollari. Se vuoi meno dipendenza da un paese, valuta un indice mondiale come parte principale."]);
  if(P.sats.length&&P.satW*P.sats.filter(function(k){return k!=="bond"}).length/P.sats.length>25)out.push(["w","La parte extra è alta","Oltre il 20-25% su temi o aree singole, i crolli pesano molto sul totale. Gli ETF tematici in media rendono meno del mercato."]);
  if(yrs<10&&P.sats.indexOf("bond")<0)out.push(["w","Orizzonte corto","Con meno di 10 anni un crollo può non fare in tempo a recuperare. Aggiungi titoli di Stato per stare più tranquillo."]);
  if(P.eta>=50&&P.sats.indexOf("bond")<0)out.push(["i","Avvicinandoti al traguardo","Molti spostano gradualmente una parte su titoli di Stato negli ultimi 10 anni, per non arrivare alla pensione nel mezzo di un crollo."]);
  if(P.fpTipo==="pip")out.push(["w","Controlla i costi del PIP","Le polizze previdenziali costano spesso l'1,5-2,5% l'anno. Confronta il loro ISC con quello del fondo negoziale del tuo contratto sul sito COVIP."]);
  if(P.fpTipo==="negoziale"&&!P.volontari)out.push(["ok","Non perdere il contributo del datore","Nei fondi negoziali, se versi anche una piccola quota tua (spesso l'1-2% dello stipendio), il datore di lavoro aggiunge la sua. Sono soldi in più a costo zero."]);
  if(P.fpTipo==="nessuno")out.push(["i","Il TFR può lavorare di più","Lasciato in azienda si rivaluta poco più dell'inflazione. In un fondo pensione a costi bassi cresce investito e in uscita è tassato dal 15% al 9%."]);
  if(P.fpTipo!=="nessuno"&&P.volontari*12<5300&&P.netto>=1300){var aliq=P.netto*12*1.32>28000?.33:.23;out.push(["ok","Lo sconto fiscale del fondo","Ogni 100 € al mese versati nel fondo ti fanno risparmiare circa "+eur(1200*aliq)+" di tasse l'anno, fino a 5.300 € di versamenti."])}
  if(rows.some(function(x){return x.gap>1}))out.push(["w","In alcuni anni la rata non ci sta","Nel "+rows.filter(function(x){return x.gap>1})[0].y+" la rata supera quello che ti avanza. Va bene per poco, ma i risparmi scendono: riduci la rata in quella fase."]);
  out.push(["i","Non vendere nei crolli","Nel tuo piano un calo tipico lungo la strada è del "+Math.round(-R.M.dd*100)+"%. Continuare a versare in quei mesi è la mossa che rende di più."]);
  return out.slice(0,7);
}

var EVENTS=[
 {id:"crollo",tag:"MERCATI",when:2,t:"I mercati crollano del 40%",d:"Come nel 2008. Tu continui a versare ogni mese e compri quote a sconto.",on:function(P){P.crolloOn=true;P.crolloAnno=Y0+2},info:"Un calo così capita quasi certamente almeno una volta in 30 anni. Chi vende lo rende definitivo; chi continua a versare recupera prima."},
 {id:"promo",tag:"LAVORO",when:4,t:"Arriva una promozione",d:"Lo stipendio sale del 15% e resta così.",on:function(P){P.promoOn=true},info:"Uno stipendio più alto alza contributi INPS e TFR: migliora la pensione anche senza toccare il PAC."},
 {id:"plus",tag:"SCELTA",when:0,t:"Alzi la rata di 50 €",d:"Cinquanta euro in più ogni mese, per tutta la durata del piano.",on:function(P){P.rataPlus+=50},info:"Ogni 10 anni sono 6.000 € versati in più, che crescono insieme al resto."},
 {id:"lavoro",tag:"LAVORO",when:5,t:"Sei mesi senza stipendio",d:"Un cambio di lavoro o una pausa. Il fondo emergenza fa da cuscinetto.",on:function(P){P.lavoroOn=true},info:"Il fondo emergenza esiste per questo: copre le spese senza vendere il PAC nel momento sbagliato."},
 {id:"figlio",tag:"FAMIGLIA",when:2,t:"Arriva un figlio in più",d:"Le spese per un figlio fino ai 24 anni, con l'assegno unico.",on:function(P){if(!P.nFigli)P.primoFiglio=Y0+2;P.nFigli=Math.min(3,P.nFigli+1)},can:function(P){return P.nFigli<3},info:"Nell'anno di nascita la rata scende di 100 €. Le spese pesano su quello che ti avanza ogni mese."},
 {id:"casa",tag:"CASA",when:4,t:"Compri casa",d:"Un mutuo da 400 € al mese e 30.000 € di contanti tra anticipo, notaio e imposte.",on:function(P){P.casaOn=true},can:function(P){return !P.casaOn},info:"I contanti per la casa restano fuori dal PAC: servono entro pochi anni. Dopo l'anticipo dal fondo pensione (75% dopo 8 anni, tassato al 23%) la rendita futura scende."},
 {id:"ered",tag:"FAMIGLIA",when:19,t:"Erediti una casa da affittare",d:"Una rendita in più: circa 300 € netti al mese.",on:function(P){P.eredOn=true},can:function(P){return !P.eredOn},info:"Un affitto in più si somma alla rendita in pensione. Non entra nel PAC."},
 {id:"vol",tag:"PREVIDENZA",when:0,t:"Versi 50 € al mese nel fondo pensione",d:"Deducibili dalle tasse; nei fondi negoziali arriva anche il contributo del datore.",on:function(P){if(P.fpTipo==="nessuno"){P.fpTipo="negoziale";P.tfrDove="fondo"}P.volontari+=50},info:"Su 600 € l'anno lo Stato ti restituisce dal 23% al 43% in tasse. Si toglie qualcosa all'avanzo per il PAC."},
 {id:"fermi",tag:"ECONOMIA",when:0,t:"Gli stipendi restano fermi",d:"Lo stipendio cresce solo con l'inflazione, per tutta la carriera.",on:function(P){P.crescita="ferma"},can:function(P){return P.crescita!=="ferma"},info:"Meno crescita vuol dire meno contributi INPS e meno TFR: la pensione pubblica scende."}
];
function metric(R){return P.obiettivo==="capitale"?R.M.p50:R.tot}
function fmtM(x){return P.obiettivo==="capitale"?kk(x):eur(x)}
function buildDeck(){st.deck=EVENTS.filter(function(e){return !e.can||e.can(P)}).map(function(e){return e.id});st.di=0;st.cur=metric(plan(P,1200));st.lastD=null;st.info=false}
function ev(id){return EVENTS.filter(function(e){return e.id===id})[0]}
function rEventi(){
  if(!st.deck.length)buildDeck();
  if(st.di>=st.deck.length){st.screen="missioni";return render()}
  var e=ev(st.deck[st.di]),now=st.cur,test=clone(P);e.on(test);
  var after=metric(plan(test,1200)),d=after-now,lab=P.obiettivo==="capitale"?"Capitale a "+P.etaPens+" anni":"Rendita a "+P.etaPens+" anni";
  view.innerHTML='<section class="screen">'+topbar('<button type="button" class="round" id="back" aria-label="Torna al piano">←</button>','<span class="eyebrow">Evento '+(st.di+1)+' di '+st.deck.length+'</span>')+
    '<div class="meter"><span>'+lab+'</span><span><b class="num">'+fmtM(now)+'</b>'+(st.lastD!=null?'<span class="delta" style="color:'+(st.lastD>=0?"var(--ok)":"var(--bad)")+'">'+(st.lastD>=0?"+":"−")+fmtM(Math.abs(st.lastD))+'</span>':"")+'</span></div>'+
    '<div class="deck"><div class="ghostcard" style="left:22px;right:22px;top:22px;bottom:-14px;background:rgba(19,16,38,.6)"></div><div class="ghostcard" style="left:11px;right:11px;top:11px;bottom:-7px;background:rgba(19,16,38,.85)"></div>'+
    '<article class="ecard" id="card"><span class="stamp yes">SUCCEDE</span><span class="stamp no">NON ORA</span>'+
    '<div class="tag"><b>'+e.tag+(e.when?" · "+(Y0+e.when):"")+'</b><span>'+(e.when?"tra "+e.when+" anni":"da subito")+'</span></div>'+
    '<h2>'+e.t+'</h2><p>'+e.d+'</p>'+(st.info?'<p class="explain">'+e.info+'</p>':"")+
    '<div class="imp"><div><span>'+lab+'</span><b class="num" style="color:'+(d>=0?"var(--ok)":"var(--bad)")+'">'+(d>=0?"+":"−")+fmtM(Math.abs(d))+'</b></div><div><span>Diventerebbe</span><b class="num">'+fmtM(after)+'</b></div></div></article></div>'+
    '<div class="choicebtns"><button type="button" class="cb" id="no">Non ora</button><button type="button" class="cb info" id="info" aria-label="Spiega meglio" aria-pressed="'+st.info+'">?</button><button type="button" class="cb yes" id="yes">Succede</button></div>'+
    '<p class="hint">Scorri a destra se succederà, a sinistra se no · +30 XP</p></section>';
  function decide(yes){var c=document.getElementById("card");c.classList.add("fly");c.style.transform="translateX("+(yes?520:-520)+"px) rotate("+(yes?24:-24)+"deg)";c.style.opacity="0";
    setTimeout(function(){if(yes){e.on(P);st.lastD=d;st.cur=after}else st.lastD=null;addXP(30,"ev-"+e.id);st.di++;st.info=false;render()},REDUCE?0:300)}
  document.getElementById("yes").onclick=function(){decide(true)};
  document.getElementById("no").onclick=function(){decide(false)};
  document.getElementById("info").onclick=function(){st.info=!st.info;render()};
  document.getElementById("back").onclick=function(){st.screen="reveal";render()};
  var c=document.getElementById("card"),sx=null,dx=0;
  c.addEventListener("pointerdown",function(p){sx=p.clientX;dx=0;c.setPointerCapture(p.pointerId)});
  c.addEventListener("pointermove",function(p){if(sx==null)return;dx=p.clientX-sx;c.style.transform="translateX("+dx+"px) rotate("+(dx/18-2)+"deg)";
    c.querySelector(".stamp.yes").style.opacity=Math.max(0,Math.min(1,dx/90));c.querySelector(".stamp.no").style.opacity=Math.max(0,Math.min(1,-dx/90))});
  function up(){if(sx==null)return;sx=null;if(dx>90)decide(true);else if(dx<-90)decide(false);else{c.classList.add("fly");c.style.transform="rotate(-2deg)";c.querySelectorAll(".stamp").forEach(function(s){s.style.opacity=0});setTimeout(function(){c.classList.remove("fly")},350)}}
  c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up);
}

function rMissioni(){
  var r=rankOf(XP),nx=RANKS[r+1],lo=RANKS[r][0],hi=nx?nx[0]:XP||1;
  var rows=cash(P),stops=[],K=kids(P),end=Y0+rows.length;
  var full=rows.filter(function(x){return x.liq>=P.mesiEmerg*x.spese-1})[0];
  stops.push(["Fondo emergenza pieno",full?full.y:Y0]);
  if(P.debRata&&P.debFine>=Y0)stops.push(["Fine delle rate",P.debFine+1]);
  K.forEach(function(b,i){if(b>=Y0)stops.push([(i+1)+"° figlio",b])});
  if(K.length&&K[K.length-1]+25<end)stops.push(["Figli indipendenti",K[K.length-1]+25]);
  if(P.casaOn)stops.push(["Casa nuova",P.casaAnno]);
  stops.push(["Traguardo: "+P.etaPens+" anni",end]);
  stops.sort(function(a,b){return a[1]-b[1]});
  var cur=0;stops.forEach(function(s2,i){if(Y0>=s2[1])cur=i});
  var lessons=LESSONS;
  view.innerHTML='<section class="screen">'+
    '<div class="top" style="gap:14px"><span class="medal">'+(r+1)+'</span><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:18px">'+RANKS[r][1]+'</b><span class="xp num" id="xp" style="border:0;padding:0">'+XP+(nx?" / "+nx[0]:"")+' XP</span></div><div class="xpbar"><i style="width:'+(nx?Math.min(100,(XP-lo)/(hi-lo)*100):100)+'%"></i></div></div></div>'+
    '<p class="eyebrow" style="margin-top:26px">Il tuo percorso · '+rows.length+' anni in '+stops.length+' tappe</p>'+
    '<div class="path">'+stops.map(function(x,i){var rr=rows.filter(function(r2){return r2.y===x[1]})[0]||rows[rows.length-1];return '<div class="lvl'+(i<cur?" done":i===cur?" now":"")+'"><span class="n">'+(i<cur?"✓":i+1)+'</span><span class="t"><b>'+x[0]+'</b><small>'+x[1]+(i===cur?" · sei qui":"")+'</small></span><span class="r num">'+Math.round(rr.rata)+' €</span></div>'}).join("")+'</div>'+
    '<p class="eyebrow" style="margin-top:22px">Missioni</p><div style="margin-top:6px">'+MISSIONS.map(function(m){return '<label class="mis"><input type="checkbox" id="m-'+m[0]+'" data-k="'+m[0]+'"'+(DONE[m[0]]?" checked":"")+'><span>'+m[1]+'</span><em>+'+m[2]+'</em></label>'}).join("")+'</div>'+
    '<p class="eyebrow" style="margin-top:22px">Le lezioni</p><div class="lessons">'+lessons.map(function(l){var ok=QUIZ[l.L]!=null&&QUIZ[l.L]===l.quiz.a;return '<button type="button" class="lesbtn" data-l="'+l.L+'"><span>'+l.t+'</span><em>'+(ok?"✓":"+30")+'</em></button>'}).join("")+'</div>'+
    '<div class="cta"><div class="row2"><button type="button" class="btn line" id="mine">Il mio piano</button><button type="button" class="btn" id="again">Nuovi eventi</button></div><button type="button" class="btn ghost" id="reset">Ricomincia da zero</button></div></section>';
  view.querySelectorAll(".mis input").forEach(function(i){i.onchange=function(){var m=MISSIONS.filter(function(x){return x[0]===i.dataset.k})[0];DONE[m[0]]=i.checked;lset("done",DONE);addXP(i.checked?m[2]:-m[2]);rMissioni()}});
  view.querySelectorAll(".lesbtn").forEach(function(b){b.onclick=function(){st.li=LESSONS.map(function(x){return x.L}).indexOf(b.dataset.l);st.screen="lesson";render()}});
  document.getElementById("mine").onclick=function(){st.screen="reveal";render()};
  document.getElementById("again").onclick=function(){buildDeck();st.screen="eventi";render()};
  document.getElementById("reset").onclick=function(){P=clone(DEF);QUIZ={};lset("quiz",QUIZ);lset("planDone",false);st.q=0;st.screen="home";render()};
}
if(st.screen==="eventi")st.screen="reveal";
render();
})();
</script>
</body>
</html>
